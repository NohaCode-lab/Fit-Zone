name: Fit-Zone SaaS Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:

  frontend-build-and-test:
    name: Frontend Quality & Type Audit
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Unit & Component Tests
        run: npm run test

      - name: Production Bundle Verification
        run: npm run build


  backend-build-and-test:
    name: NestJS Backend & Database Verification
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: "ci-secret-key-min-32-characters-for-testing-purposes"
      DATABASE_URL: "postgresql://fitzone_admin:SecurePass123!@localhost:5432/fitzone_test?schema=public"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Backend Code Linting
        working-directory: backend
        run: npm run lint

      - name: Backend TypeScript Type-Check
        working-directory: backend
        run: npm run typecheck

      - name: Backend Unit Tests
        working-directory: backend
        run: npm run test

      - name: NestJS Production Build
        working-directory: backend
        run: npm run build


  docker-build-and-scan:
    name: Docker Production Image Build & Security Scan
    needs:
      - frontend-build-and-test
      - backend-build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Docker Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fit-zone-backend:latest'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true