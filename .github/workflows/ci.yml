name: Fit-Zone SaaS Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build-and-test:
    name: Frontend Quality & Type Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Unit & Component Tests
        run: npm run test

      - name: Production Bundle Verification
        run: npm run build

  backend-build-and-test:
    name: NestJS Backend & Database Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: NestJS Server Build
        run: |
          cd backend
          npm run build

  docker-security-scan:
    name: Security & Container Scan
    needs: [frontend-build-and-test, backend-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Validate Docker Compose Orchestration
        run: docker compose config
