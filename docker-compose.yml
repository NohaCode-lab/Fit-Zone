name: fit-zone

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fit-zone-frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fit-zone-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://fitzone_admin:SecurePass123!@postgres:5432/fitzone_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "FitZoneSuperSecretKey2026!"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: fit-zone-postgres
    environment:
      POSTGRES_USER: fitzone_admin
      POSTGRES_PASSWORD: SecurePass123!
      POSTGRES_DB: fitzone_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitzone_admin -d fitzone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: fit-zone-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: fit-zone-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.3.1
    container_name: fit-zone-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata:
    driver: local
